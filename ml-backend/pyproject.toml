[project]
name = "peakpick-ml"
version = "0.1.0"
description = "PeakPick ML backend - photo scoring, online learning, and preference modeling"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pillow>=10.0.0",
    "torch>=2.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
cuda = ["torch>=2.0.0"]
cpu = ["torch>=2.0.0 --index-url https://download.pytorch.org/whl/cpu"]

[tool.setuptools.packages.find]
include = ["peakpick_ml*"]
